name: Padronização de código (Prettier)

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "data/**"
      - ".github/workflows/**"
      - "*.js"
      - "*.jsx"
      - "*.mjs"
      - "*.json"
      - "*.md"
      - ".prettierrc.json"
      - ".prettierignore"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prettier-central-comercial-main
  cancel-in-progress: false

jobs:
  format:
    name: Formatar e validar
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obter versão atual do repositório
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Padronizar todos os arquivos suportados
        run: npx --yes prettier@3.6.2 --write . --ignore-path .prettierignore

      - name: Validar diferenças e espaços
        run: git diff --check

      - name: Instalar dependências para validar compilação
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: Verificar build da Central Comercial
        # Valores exclusivamente locais para a compilação. Não têm acesso a
        # sessão, banco ou outros serviços reais da Central Comercial.
        env:
          NEON_AUTH_COOKIE_SECRET: "ci-validation-only-cookie-secret-never-production-2026"
          NEON_AUTH_BASE_URL: "https://auth-ci.example.invalid"
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/centralcomercial"
        run: npm run build

      - name: Publicar código formatado, apenas se o build passou
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Todos os arquivos já estão padronizados."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: padroniza código do projeto com Prettier"
          git push origin HEAD:main
